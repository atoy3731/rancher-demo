{{- if .Values.config.ingressEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rancher-demo-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: {{ .Values.config.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rancher-demo.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
{{- end -}}
