{{- if .Values.config.ingressEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rancher-demo-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.config.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rancher-demo
            port:
              number: 8080
{{- end -}}
